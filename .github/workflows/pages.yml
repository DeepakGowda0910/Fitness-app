name: Publish web app

# Publishes to GitHub Pages (https://<owner>.github.io/<repo>/) on every change to main.
# The main link is Cloudflare Pages (see docs/hosting.md); this keeps the old link working,
# either as a full copy of the app or, once NEW_SITE_URL is set, as forwarding pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Normal mode: the full app at https://<owner>.github.io/<repo>/.
      - name: Build the app and admin site
        if: ${{ vars.NEW_SITE_URL == '' }}
        run: bash scripts/build-site.sh
        env:
          SITE_BASE_PATH: /${{ github.event.repository.name }}
          # Public values (repository variables, not secrets): data is protected by row-level security.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      # Moved mode: once the repository variable NEW_SITE_URL is set (for example
      # https://hyperactive.pages.dev), every old link forwards to the same page there.
      - name: Build forwarding pages to the new link
        if: ${{ vars.NEW_SITE_URL != '' }}
        run: node scripts/build-redirect.mjs apps/web/out
        env:
          NEW_SITE_URL: ${{ vars.NEW_SITE_URL }}
          OLD_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
